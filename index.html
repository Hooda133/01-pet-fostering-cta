<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Fostering | Give Them Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="site-header">
      <a href="/" aria-label="PetQuest home">PetQuest</a>
    </header>
    <section class="foster-banner" aria-labelledby="foster-title">
      <div class="banner-content">
        <p class="eyebrow">A little time. A lifelong difference.</p>
        <h1 id="foster-title">Open your home.<br><span>Change a life.</span></h1>
        <p class="banner-description">Fostering gives rescue animals a safe place to heal, grow, and feel loved while they wait for their forever family.</p>
        <a class="cta-button" href="#get-started">Become a foster parent <span aria-hidden="true">&#8594;</span></a>
      </div>
      <figure class="pet-photo">
        <img src="img/pet.jpg" alt="Rescue dog resting comfortably indoors">
        <figcaption>Every animal deserves a soft place to land.</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
